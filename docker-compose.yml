services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-callmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callmind_password}
      POSTGRES_DB: ${POSTGRES_DB:-callmind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
